name: CI

on:
  push:
    # Branches only: the release workflow pushes a tag whose Package.swift
    # points at a release asset that is not public yet at tag-push time.
    branches: ['**']
  pull_request:

jobs:
  reference-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.15.1
      - name: Install oracle dependencies
        run: pnpm --dir conformance/oracle install --frozen-lockfile
      - name: Verify pinned reference fixtures
        run: pnpm --dir conformance/oracle test
      - name: Verify committed mainnet snapshots
        run: pnpm --dir conformance/oracle mainnet:verify
      - name: Verify the Subscriptions IDL derivation is reproducible
        run: pnpm --dir conformance/oracle author:verify
      - name: Verify committed devnet snapshots
        run: pnpm --dir conformance/oracle devnet:verify

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-features

  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build XCFramework and Swift bindings
        run: ./scripts/build-xcframework.sh
      - name: Committed Swift bindings must match regeneration
        run: |
          if [ -n "$(git status --porcelain -- bindings/swift/generated)" ]; then
            git --no-pager status --short -- bindings/swift/generated
            git --no-pager diff -- bindings/swift/generated | head -200
            echo "::error::bindings/swift/generated differs from the committed bindings. Run ./scripts/build-xcframework.sh locally and commit the result." >&2
            exit 1
          fi
      - name: Test public Swift SDK
        run: swift test
      - name: Generate demo project
        working-directory: ios-demo
        run: xcodegen generate --spec project.yml
      - name: Build and test demo on iOS Simulator
        working-directory: ios-demo
        run: |
          set -euo pipefail
          # Newest available iOS runtime the selected Xcode supports; runtimes
          # without devices stay in the listing and must be skipped.
          sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          simulator_id="$(
            xcrun simctl list devices available --json |
              SDK_MAJOR="${sdk_version%%.*}" ruby -rjson -e '
                sdk_major = Integer(ENV.fetch("SDK_MAJOR"))
                candidates = JSON.parse(STDIN.read).fetch("devices").filter_map do |runtime, devices|
                  version = runtime[/\.iOS-([0-9-]+)\z/, 1]&.split("-")&.map(&:to_i)
                  phone = devices.find { |device| device["name"].start_with?("iPhone") }
                  [version, phone] if version && phone && version.first <= sdk_major
                end
                _, phone = candidates.max_by(&:first) || abort("no available iPhone simulator for iOS #{sdk_major} or older")
                puts phone.fetch("udid")
              '
          )"
          xcodebuild -quiet \
            -project ClearsignDemo.xcodeproj \
            -scheme ClearsignDemo \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            test CODE_SIGNING_ALLOWED=NO
